[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-safety-cad"
version = "0.1.0"
description = "AI-powered Event Safety Planning and DXF Generation according to Israeli regulations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ezdxf>=1.3",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
event-safety-cad = "generator.cli:main"

[tool.setuptools]
packages = ["generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
